# Windows test suite (tests/run-tests.ps1) on a GitHub-hosted Windows runner.
#
# Deliberately NOT on every push: Windows minutes are the expensive kind.
# It runs in batches, at the points where a result is actually needed:
#   - a PR is opened, reopened, or marked ready for review (drafts skipped);
#   - someone adds the label `run-windows-ci` to a PR (re-run after a batch
#     of pushes - remove and re-add the label to run again);
#   - manually: Actions -> "windows-tests" -> Run workflow (any branch; the
#     button appears once this file is on the default branch).
# A newer run for the same ref cancels an older one still in flight.
# Actions are pinned to full commit SHAs (tag in the trailing comment);
# Dependabot (.github/dependabot.yml) proposes the bumps.

name: windows-tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && (
        (github.event.action == 'labeled' && github.event.label.name == 'run-windows-ci') ||
        (github.event.action != 'labeled' && !github.event.pull_request.draft)))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # fork PRs are skipped above: their code would run on this runner
      # with the global npm install below; a maintainer re-runs them from a
      # branch here (workflow_dispatch) after reading the diff
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # newest LTS Node (24 today, 26 from 2026-10-28); engines.node >= 24.
      # The npm cache is keyed on the MCP server lockfile
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/tier2/mcp-server/package-lock.json

      # tier2.claude_exe 'auto' resolves claude via PATH (README requirement);
      # the suite never calls it live - Tier 2 runs against tests/stubs
      - name: Claude Code CLI on PATH
        shell: pwsh
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: MCP server dependencies
        shell: pwsh
        run: npm ci --ignore-scripts --prefix src/tier2/mcp-server   # no dependency runs code at install

      # versions on record for every run, checked against the documented minimums
      - name: Environment versions
        shell: pwsh
        run: pwsh -NoProfile -File install/probe-environment.ps1 -Strict -AllowMissing burnttoast

      # every case must run here: a skipped case (no symlink privilege, no
      # node_modules, 8.3 disabled) fails the run instead of passing quietly
      - name: Test suite
        shell: pwsh
        env:
          NETWATCH_REQUIRE_ALL: '1'
        run: pwsh -NoProfile -File tests/run-tests.ps1

      # live Sysmon, AFTER the suite (which covers the no-Sysmon path). It
      # installs the real driver (hosted runners are disposable) and checks
      # enable-sysmon.ps1's signer/version gate + config, read back through
      # sysmon.psm1. Downloaded from Microsoft; enable-sysmon verifies the
      # Authenticode signer before running it.
      - name: Sysmon live
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'Sysmon.zip'
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Sysmon.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sysmon') -Force
          pwsh -NoProfile -File tests/ci/sysmon-live.ps1 -SysmonExe (Join-Path $env:RUNNER_TEMP 'sysmon\Sysmon64.exe')
