# Windows test suite (tests/run-tests.ps1) on a GitHub-hosted Windows runner.
#
# Deliberately NOT on every push: Windows minutes are the expensive kind.
# It runs in batches, at the points where a result is actually needed:
#   - a PR is opened, reopened, or marked ready for review (drafts skipped);
#   - someone adds the label `run-windows-ci` to a PR (re-run after a batch
#     of pushes - remove and re-add the label to run again);
#   - manually: Actions -> "windows-tests" -> Run workflow (any branch; the
#     button appears once this file is on the default branch).
# A newer run for the same ref cancels an older one still in flight.

name: windows-tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-windows-ci') ||
      (github.event.action != 'labeled' && !github.event.pull_request.draft)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # newest LTS Node (24 today, 26 from 2026-10-28); engines.node >= 24.
      # The npm cache is keyed on the MCP server lockfile
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/tier2/mcp-server/package-lock.json

      # tier2.claude_exe 'auto' resolves claude via PATH (README requirement);
      # the suite never calls it live - Tier 2 runs against tests/stubs
      - name: Claude Code CLI on PATH
        shell: pwsh
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: MCP server dependencies
        shell: pwsh
        run: npm ci --prefix src/tier2/mcp-server

      # versions on record for every run, checked against the documented minimums
      - name: Environment versions
        shell: pwsh
        run: pwsh -NoProfile -File install/probe-environment.ps1

      - name: Test suite
        shell: pwsh
        run: pwsh -NoProfile -File tests/run-tests.ps1
